<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="'Hanken Grotesk','Segoe UI',system-ui,-apple-system,sans-serif">
  <defs>
    <linearGradient id="gViolet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6D4BFF"/><stop offset="1" stop-color="#FF4FA3"/>
    </linearGradient>
    <linearGradient id="gMint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10C8A0"/><stop offset="1" stop-color="#2BB3FF"/>
    </linearGradient>
    <linearGradient id="gSky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2BB3FF"/><stop offset="1" stop-color="#6D4BFF"/>
    </linearGradient>
    <linearGradient id="gAmber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF9F2E"/><stop offset="1" stop-color="#FF4FA3"/>
    </linearGradient>
    <linearGradient id="gCoral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF5C6E"/><stop offset="1" stop-color="#10C8A0"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#1B1530" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#928CA6"/>
    </marker>
    <marker id="arrowV" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#6D4BFF"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="1280" height="720" fill="#F1F0F8"/>
  <ellipse cx="80" cy="-40" rx="420" ry="320" fill="#6D4BFF" opacity="0.10"/>
  <ellipse cx="1240" cy="40" rx="420" ry="300" fill="#FF4FA3" opacity="0.09"/>
  <ellipse cx="1260" cy="720" rx="420" ry="300" fill="#FF9F2E" opacity="0.08"/>
  <ellipse cx="40" cy="740" rx="420" ry="300" fill="#2BB3FF" opacity="0.09"/>

  <!-- header -->
  <rect x="40" y="34" width="44" height="44" rx="12" fill="url(#gViolet)"/>
  <path d="M62 46 v20 M55 52 v8 M69 52 v8" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
  <text x="98" y="54" font-size="25" font-weight="800" fill="#1B1530" letter-spacing="-0.5">Timbre — VoiceShield Forge</text>
  <text x="99" y="78" font-size="13.5" font-weight="500" fill="#544C6B">CI/CD for voice‑agent safety · a self‑improving crisis‑escalation harness</text>

  <!-- header metric chips -->
  <g font-size="12" font-weight="700" font-family="'JetBrains Mono',monospace">
    <rect x="858" y="38" width="138" height="26" rx="13" fill="#10C8A0" opacity="0.16"/>
    <text x="927" y="55" text-anchor="middle" fill="#0a7a60">missed esc 4 → 0</text>
    <rect x="1004" y="38" width="120" height="26" rx="13" fill="#2BB3FF" opacity="0.16"/>
    <text x="1064" y="55" text-anchor="middle" fill="#1670a8">handoff 30→90%</text>
    <rect x="1132" y="38" width="108" height="26" rx="13" fill="#FF9F2E" opacity="0.18"/>
    <text x="1186" y="55" text-anchor="middle" fill="#9a5a00">STAGING PASS</text>
  </g>

  <!-- ===================== TOP ROW (left to right) ===================== -->
  <!-- arrows top -->
  <g stroke="#928CA6" stroke-width="2.2" fill="none" marker-end="url(#arrow)">
    <line x1="206" y1="193" x2="264" y2="193"/>
    <line x1="434" y1="193" x2="492" y2="193"/>
    <line x1="662" y1="193" x2="720" y2="193"/>
    <line x1="890" y1="193" x2="948" y2="193"/>
  </g>
  <!-- A Ingress -->
  <g filter="url(#sh)"><rect x="40" y="150" width="164" height="86" rx="16" fill="#fff" stroke="#1B153018"/></g>
  <circle cx="62" cy="180" r="5" fill="url(#gSky)"/>
  <text x="76" y="184" font-size="14.5" font-weight="700" fill="#1B1530">Ingress</text>
  <text x="58" y="208" font-size="11.5" fill="#544C6B">Daily · Twilio · Pipecat</text>
  <text x="58" y="224" font-size="10.5" fill="#928CA6">real-time + PSTN</text>
  <!-- B CallTrace -->
  <g filter="url(#sh)"><rect x="268" y="150" width="164" height="86" rx="16" fill="#fff" stroke="#1B153018"/></g>
  <circle cx="290" cy="180" r="5" fill="#6D4BFF"/>
  <text x="304" y="184" font-size="14.5" font-weight="700" fill="#1B1530">CallTrace</text>
  <text x="286" y="208" font-size="11.5" fill="#544C6B">one normalized schema</text>
  <text x="286" y="224" font-size="10.5" fill="#928CA6">any surface → same shape</text>
  <!-- C Cekura baseline -->
  <g filter="url(#sh)"><rect x="496" y="150" width="164" height="86" rx="16" fill="#fff" stroke="#10C8A033"/></g>
  <circle cx="518" cy="180" r="5" fill="url(#gMint)"/>
  <text x="532" y="184" font-size="14.5" font-weight="700" fill="#1B1530">Cekura · baseline</text>
  <rect x="600" y="160" width="44" height="18" rx="9" fill="#10C8A0" opacity="0.18"/>
  <text x="622" y="173" text-anchor="middle" font-size="9.5" font-weight="700" font-family="'JetBrains Mono',monospace" fill="#0a7a60">LIVE</text>
  <text x="514" y="208" font-size="11.5" fill="#544C6B">score the safety protocol</text>
  <text x="514" y="224" font-size="10.5" fill="#928CA6">not "does it sound good"</text>
  <!-- D Failure Router -->
  <g filter="url(#sh)"><rect x="724" y="150" width="164" height="86" rx="16" fill="#fff" stroke="#1B153018"/></g>
  <circle cx="746" cy="180" r="5" fill="url(#gSky)"/>
  <text x="760" y="184" font-size="14.5" font-weight="700" fill="#1B1530">Failure Router</text>
  <text x="742" y="208" font-size="11.5" fill="#544C6B">which layer failed?</text>
  <text x="742" y="224" font-size="10.5" fill="#928CA6">→ safety/escalation, not ASR</text>
  <!-- E Repair Compiler -->
  <g filter="url(#sh)"><rect x="952" y="150" width="164" height="86" rx="16" fill="#fff" stroke="#6D4BFF22"/></g>
  <circle cx="974" cy="180" r="5" fill="url(#gViolet)"/>
  <text x="988" y="184" font-size="14.5" font-weight="700" fill="#1B1530">Repair Compiler</text>
  <text x="970" y="208" font-size="11.5" fill="#544C6B">concrete escalation patch</text>
  <text x="970" y="224" font-size="10.5" fill="#928CA6">risk detector · 988 gate · guardrail</text>

  <!-- down connector E -> F -->
  <line x1="1034" y1="236" x2="1034" y2="328" stroke="#928CA6" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>

  <!-- ===================== BOTTOM ROW (right to left) ===================== -->
  <g stroke="#928CA6" stroke-width="2.2" fill="none" marker-end="url(#arrow)">
    <line x1="950" y1="373" x2="892" y2="373"/>
    <line x1="722" y1="373" x2="664" y2="373"/>
    <line x1="494" y1="373" x2="436" y2="373"/>
  </g>
  <!-- F Generated harder evals -->
  <g filter="url(#sh)"><rect x="952" y="330" width="164" height="86" rx="16" fill="#fff" stroke="#FF9F2E2b"/></g>
  <circle cx="974" cy="360" r="5" fill="url(#gAmber)"/>
  <text x="988" y="364" font-size="14.5" font-weight="700" fill="#1B1530">Harder evals</text>
  <text x="970" y="388" font-size="11.5" fill="#544C6B">generated from the failure</text>
  <text x="970" y="404" font-size="10.5" fill="#928CA6">vague risk · denial · pressure</text>
  <!-- G Cekura regression -->
  <g filter="url(#sh)"><rect x="724" y="330" width="164" height="86" rx="16" fill="#fff" stroke="#10C8A033"/></g>
  <circle cx="746" cy="360" r="5" fill="url(#gMint)"/>
  <text x="760" y="364" font-size="14.5" font-weight="700" fill="#1B1530">Cekura · regression</text>
  <rect x="828" y="340" width="44" height="18" rx="9" fill="#10C8A0" opacity="0.18"/>
  <text x="850" y="353" text-anchor="middle" font-size="9.5" font-weight="700" font-family="'JetBrains Mono',monospace" fill="#0a7a60">LIVE</text>
  <text x="742" y="388" font-size="11.5" fill="#544C6B">prove the repair holds</text>
  <text x="742" y="404" font-size="10.5" fill="#928CA6">agent 18038 · real result ids</text>
  <!-- H Regression Gate -->
  <g filter="url(#sh)"><rect x="496" y="330" width="164" height="86" rx="16" fill="#fff" stroke="#FF5C6E2b"/></g>
  <circle cx="518" cy="360" r="5" fill="url(#gCoral)"/>
  <text x="532" y="364" font-size="14.5" font-weight="700" fill="#1B1530">Regression Gate</text>
  <text x="514" y="388" font-size="11.5" fill="#544C6B">missed→0 · unsafe→0</text>
  <text x="514" y="404" font-size="10.5" fill="#928CA6">no latency/safety regression</text>
  <!-- I Outputs -->
  <g filter="url(#sh)"><rect x="268" y="330" width="164" height="86" rx="16" fill="#fff" stroke="#1B153018"/></g>
  <circle cx="290" cy="360" r="5" fill="#544C6B"/>
  <text x="304" y="364" font-size="14.5" font-weight="700" fill="#1B1530">Persist + Console</text>
  <text x="286" y="388" font-size="11.5" fill="#544C6B">AWS · Timbre dashboard</text>
  <text x="286" y="404" font-size="10.5" fill="#928CA6">before → after, live</text>

  <!-- H -> I arrow already drawn (494->436). decision pill under H -->
  <rect x="470" y="430" width="216" height="30" rx="15" fill="url(#gMint)" opacity="0.95"/>
  <text x="578" y="450" text-anchor="middle" font-size="12" font-weight="800" font-family="'JetBrains Mono',monospace" fill="#fff">STAGING PASS · HUMAN REVIEW REQ</text>

  <!-- ===================== FEEDBACK LOOP ===================== -->
  <path d="M578 460 Q578 540 520 540 L182 540 Q122 540 122 488 L122 240"
        fill="none" stroke="#6D4BFF" stroke-width="2.4" stroke-dasharray="2 7" stroke-linecap="round" marker-end="url(#arrowV)"/>
  <text x="300" y="566" font-size="12.5" font-weight="700" fill="#6D4BFF" font-family="'JetBrains Mono',monospace">self‑improving loop — every failed call becomes a test → a repair → proof</text>

  <!-- safety note -->
  <text x="470" y="478" font-size="10.5" fill="#928CA6">simulated 988 handoff — no real emergency call is ever placed</text>

  <!-- ===================== SPONSOR STRIP ===================== -->
  <text x="40" y="632" font-size="11" font-weight="700" font-family="'JetBrains Mono',monospace" fill="#928CA6" letter-spacing="1">POWERED BY</text>
  <g font-size="12.5" font-weight="600">
    <g filter="url(#sh)"><rect x="40" y="648" width="120" height="40" rx="12" fill="#fff" stroke="#1B153014"/></g>
    <text x="56" y="672" fill="#1B1530">Daily</text><text x="56" y="684" font-size="9.5" fill="#928CA6">media</text>
    <g filter="url(#sh)"><rect x="172" y="648" width="120" height="40" rx="12" fill="#fff" stroke="#1B153014"/></g>
    <text x="188" y="672" fill="#1B1530">Pipecat</text><text x="188" y="684" font-size="9.5" fill="#928CA6">pipeline</text>
    <g filter="url(#sh)"><rect x="304" y="648" width="148" height="40" rx="12" fill="#fff" stroke="#10C8A033"/></g>
    <text x="320" y="672" fill="#1B1530">Cekura</text>
    <rect x="392" y="658" width="44" height="18" rx="9" fill="#10C8A0" opacity="0.18"/>
    <text x="414" y="671" text-anchor="middle" font-size="9.5" font-weight="700" font-family="'JetBrains Mono',monospace" fill="#0a7a60">LIVE</text>
    <text x="320" y="684" font-size="9.5" fill="#928CA6">crisis eval loop</text>
    <g filter="url(#sh)"><rect x="464" y="648" width="148" height="40" rx="12" fill="#fff" stroke="#76B90033"/></g>
    <text x="480" y="672" fill="#1B1530">NVIDIA Nemotron</text><text x="480" y="684" font-size="9.5" fill="#928CA6">open‑weights STT+LLM</text>
    <g filter="url(#sh)"><rect x="624" y="648" width="120" height="40" rx="12" fill="#fff" stroke="#1B153014"/></g>
    <text x="640" y="672" fill="#1B1530">Twilio</text><text x="640" y="684" font-size="9.5" fill="#928CA6">PSTN + handoff</text>
    <g filter="url(#sh)"><rect x="756" y="648" width="120" height="40" rx="12" fill="#fff" stroke="#1B153014"/></g>
    <text x="772" y="672" fill="#1B1530">AWS</text><text x="772" y="684" font-size="9.5" fill="#928CA6">persistence</text>
  </g>
</svg>
