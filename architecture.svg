<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" font-family="'Inter','Segoe UI',Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F9FBFF"/>
      <stop offset="1" stop-color="#F1FFF9"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10C8A0"/>
      <stop offset="1" stop-color="#2BB3FF"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF7A73"/>
      <stop offset="1" stop-color="#FFB35C"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6D4BFF"/>
      <stop offset="1" stop-color="#2BB3FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#20304A" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#718096"/>
    </marker>
    <style>
      .title { font-size: 31px; font-weight: 800; fill: #172033; }
      .subtitle { font-size: 16px; font-weight: 500; fill: #526073; }
      .step { font-size: 13px; font-weight: 800; fill: #667085; letter-spacing: .5px; }
      .h { font-size: 20px; font-weight: 800; fill: #172033; }
      .body { font-size: 13px; fill: #526073; }
      .small { font-size: 11.5px; fill: #667085; }
      .tag { font-size: 11px; font-weight: 800; fill: #172033; }
      .tagLite { font-size: 10.5px; font-weight: 700; fill: #526073; }
    </style>
  </defs>

  <rect width="1280" height="900" fill="url(#bg)"/>
  <circle cx="98" cy="94" r="210" fill="#FF7A73" opacity="0.08"/>
  <circle cx="1154" cy="96" r="245" fill="#2BB3FF" opacity="0.09"/>
  <circle cx="1078" cy="802" r="270" fill="#10C8A0" opacity="0.08"/>

  <text x="56" y="58" class="title">Timbre / VoiceShield Forge</text>
  <text x="56" y="88" class="subtitle">How the hackathon sponsor tools work together: live voice in, safety evaluation, repair, regression proof, human review.</text>

  <g stroke="#718096" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M394 226 C424 226 442 226 472 226"/>
    <path d="M808 226 C838 226 856 226 886 226"/>
    <path d="M1025 322 C1016 370 986 395 943 424"/>
    <path d="M886 575 C856 575 838 575 808 575"/>
    <path d="M472 575 C442 575 424 575 394 575"/>
  </g>
  <path d="M234 423 C195 374 185 331 194 295" fill="none" stroke="#6D4BFF" stroke-width="3" stroke-dasharray="7 9" marker-end="url(#arrow)"/>

  <!-- Step 1 -->
  <g filter="url(#shadow)">
    <rect x="56" y="140" width="338" height="172" rx="20" fill="#FFFFFF" stroke="#FFE0DA"/>
    <rect x="78" y="164" width="52" height="52" rx="16" fill="url(#coral)"/>
    <path d="M94 191 C102 178 114 178 122 191" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
    <circle cx="108" cy="202" r="4" fill="#FFFFFF"/>
    <text x="146" y="166" class="step">STEP 1</text>
    <text x="146" y="194" class="h">Live call enters</text>
    <text x="78" y="244" class="body">
      <tspan x="78" dy="0">A caller reaches the agent through web</tspan>
      <tspan x="78" dy="18">or phone, creating the live experience.</tspan>
    </text>
    <g>
      <rect x="78" y="278" width="64" height="22" rx="11" fill="#EAF7FF"/>
      <text x="110" y="293" text-anchor="middle" class="tag">Daily</text>
      <rect x="150" y="278" width="66" height="22" rx="11" fill="#FFF0E8"/>
      <text x="183" y="293" text-anchor="middle" class="tag">Twilio</text>
      <rect x="224" y="278" width="72" height="22" rx="11" fill="#EFEAFF"/>
      <text x="260" y="293" text-anchor="middle" class="tag">Pipecat</text>
    </g>
  </g>

  <!-- Step 2 -->
  <g filter="url(#shadow)">
    <rect x="472" y="140" width="338" height="172" rx="20" fill="#FFFFFF" stroke="#D9F3FF"/>
    <rect x="494" y="164" width="52" height="52" rx="16" fill="url(#violet)"/>
    <path d="M510 190 H530 M520 180 V200" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
    <text x="562" y="166" class="step">STEP 2</text>
    <text x="562" y="194" class="h">Voice agent runs</text>
    <text x="494" y="244" class="body">
      <tspan x="494" dy="0">Pipecat connects ASR, model reasoning,</tspan>
      <tspan x="494" dy="18">tools, and TTS in one realtime loop.</tspan>
    </text>
    <g>
      <rect x="494" y="278" width="72" height="22" rx="11" fill="#EFEAFF"/>
      <text x="530" y="293" text-anchor="middle" class="tag">Pipecat</text>
      <rect x="574" y="278" width="118" height="22" rx="11" fill="#ECF8E8"/>
      <text x="633" y="293" text-anchor="middle" class="tag">NVIDIA</text>
      <rect x="700" y="278" width="76" height="22" rx="11" fill="#FFF7DD"/>
      <text x="738" y="293" text-anchor="middle" class="tag">Gradium</text>
    </g>
  </g>

  <!-- Step 3 -->
  <g filter="url(#shadow)">
    <rect x="886" y="140" width="338" height="172" rx="20" fill="#FFFFFF" stroke="#D5F8EF"/>
    <rect x="908" y="164" width="52" height="52" rx="16" fill="url(#mint)"/>
    <path d="M922 193 L932 203 L952 180" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="976" y="166" class="step">STEP 3</text>
    <text x="976" y="194" class="h">Safety is scored</text>
    <text x="908" y="244" class="body">
      <tspan x="908" dy="0">The trace proves what the agent heard.</tspan>
      <tspan x="908" dy="18">Cekura scores the safety protocol.</tspan>
    </text>
    <g>
      <rect x="908" y="278" width="72" height="22" rx="11" fill="#EFEAFF"/>
      <text x="944" y="293" text-anchor="middle" class="tag">Pipecat</text>
      <rect x="988" y="278" width="72" height="22" rx="11" fill="#E8FFF6"/>
      <text x="1024" y="293" text-anchor="middle" class="tag">Cekura</text>
      <rect x="1068" y="278" width="118" height="22" rx="11" fill="#ECF8E8"/>
      <text x="1127" y="293" text-anchor="middle" class="tag">NVIDIA ASR</text>
    </g>
  </g>

  <!-- Step 6 -->
  <g filter="url(#shadow)">
    <rect x="56" y="488" width="338" height="184" rx="20" fill="#FFFFFF" stroke="#E7EBF3"/>
    <rect x="78" y="512" width="52" height="52" rx="16" fill="#526073"/>
    <path d="M93 538 C103 526 114 526 124 538 M88 552 H128" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
    <text x="146" y="514" class="step">STEP 6</text>
    <text x="146" y="542" class="h">Evidence is saved</text>
    <text x="78" y="592" class="body">
      <tspan x="78" dy="0">AWS stores reports and run indexes.</tspan>
      <tspan x="78" dy="18">The dashboard shows sponsor proof.</tspan>
    </text>
    <g>
      <rect x="78" y="626" width="58" height="22" rx="11" fill="#FFF7DD"/>
      <text x="107" y="641" text-anchor="middle" class="tag">AWS</text>
      <rect x="144" y="626" width="82" height="22" rx="11" fill="#F1F4F9"/>
      <text x="185" y="641" text-anchor="middle" class="tag">Dashboard</text>
      <rect x="234" y="626" width="74" height="22" rx="11" fill="#E8FFF6"/>
      <text x="271" y="641" text-anchor="middle" class="tag">Cekura</text>
    </g>
  </g>

  <!-- Step 5 -->
  <g filter="url(#shadow)">
    <rect x="472" y="488" width="338" height="184" rx="20" fill="#FFFFFF" stroke="#FFE8CC"/>
    <rect x="494" y="512" width="52" height="52" rx="16" fill="#FFB35C"/>
    <path d="M521 526 L521 544" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
    <circle cx="521" cy="555" r="4" fill="#FFFFFF"/>
    <text x="562" y="514" class="step">STEP 5</text>
    <text x="562" y="542" class="h">Regression gate</text>
    <text x="494" y="592" class="body">
      <tspan x="494" dy="0">Cekura reruns repaired scenarios.</tspan>
      <tspan x="494" dy="18">The gate checks safety and latency.</tspan>
    </text>
    <g>
      <rect x="494" y="626" width="72" height="22" rx="11" fill="#E8FFF6"/>
      <text x="530" y="641" text-anchor="middle" class="tag">Cekura</text>
      <rect x="574" y="626" width="66" height="22" rx="11" fill="#FFF0E8"/>
      <text x="607" y="641" text-anchor="middle" class="tag">Twilio</text>
      <rect x="648" y="626" width="86" height="22" rx="11" fill="#F1F4F9"/>
      <text x="691" y="641" text-anchor="middle" class="tag">Human gate</text>
    </g>
  </g>

  <!-- Step 4 -->
  <g filter="url(#shadow)">
    <rect x="886" y="488" width="338" height="184" rx="20" fill="#FFFFFF" stroke="#DDD7FF"/>
    <rect x="908" y="512" width="52" height="52" rx="16" fill="url(#violet)"/>
    <path d="M921 549 L947 523 M921 523 L947 549" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
    <text x="976" y="514" class="step">STEP 4</text>
    <text x="976" y="542" class="h">Failure becomes repair</text>
    <text x="908" y="592" class="body">
      <tspan x="908" dy="0">The failed call turns into a policy,</tspan>
      <tspan x="908" dy="18">guardrails, metadata, and harder evals.</tspan>
    </text>
    <g>
      <rect x="908" y="626" width="72" height="22" rx="11" fill="#E8FFF6"/>
      <text x="944" y="641" text-anchor="middle" class="tag">Cekura</text>
      <rect x="988" y="626" width="86" height="22" rx="11" fill="#ECF8E8"/>
      <text x="1031" y="641" text-anchor="middle" class="tag">NVIDIA</text>
      <rect x="1082" y="626" width="72" height="22" rx="11" fill="#EFEAFF"/>
      <text x="1118" y="641" text-anchor="middle" class="tag">Pipecat</text>
    </g>
  </g>

  <!-- Results strip -->
  <g filter="url(#shadow)">
    <rect x="56" y="728" width="1168" height="94" rx="22" fill="#FFFFFF" stroke="#DDE7F0"/>
    <text x="82" y="762" font-size="16" font-weight="800" fill="#172033">What the loop proves</text>
    <text x="82" y="794" class="body">Missed handoffs: 4 -> 0</text>
    <text x="306" y="794" class="body">Unsafe responses: 3 -> 0</text>
    <text x="552" y="794" class="body">Correct handoff: 30% -> 90%</text>
    <text x="822" y="794" class="body">Decision: staging pass, human review required</text>
  </g>

  <text x="56" y="868" class="small">Safety note: the Twilio 988 handoff in this repo is simulated. No real emergency call is placed.</text>
</svg>
